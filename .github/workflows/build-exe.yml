name: Construire l'exécutable Windows

on:
  workflow_dispatch:      # bouton "Run workflow" manuel sur GitHub
  push:
    branches: [ main ]     # se relance à chaque envoi sur la branche main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construire l'exécutable
        run: >
          python -m PyInstaller --onedir --noconfirm --clean
          --name OleronNavettes
          --add-data "app.py;."
          --add-data "planner.py;."
          --add-data "arrets.csv;."
          --add-data "horaires_long.csv;."
          --collect-all streamlit
          --collect-all altair
          --collect-all pandas
          launcher.py

      - name: Publier le résultat (fichier téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: OleronNavettes-Windows
          path: dist/OleronNavettes
